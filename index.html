<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIN Calculator Project</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./script.js" defer></script>
</head>

<body>

    <div class="calculator-container">

        <div class="display-container">
            <div class="upperdisplay-container">
                <div class="upperdisplay upperdisplay-leftside">READY</div>
                <div class="upperdisplay upperdisplay-rightside">(empty)</div>
            </div>
            <div class="primary-display">0.00</div>        
        </div> 

        <div class="button-container">

            <div class="button-row row1">
                <button class="degree-radian-button calculator-button ">rad</button>
                <button class="function-button calculator-button">x!</button>
                <button class="immediate-button calculator-button">&lpar;</button>
                <button class="immediate-button calculator-button">&rpar;</button>
                <button class="immediate-button calculator-button">&percnt;</button>
                <button class="backspace-button calculator-button">&lt;</button>
                <button class="clearall-button calculator-button">AC</button>
            </div>

            <div class="button-row row2">
                <button class="immediate-button calculator-button">Inv</button>
                <button class="function-button calculator-button">sin</button>
                <button class="function-button calculator-button">ln</button>
                <button class="digit-button calculator-button">7</button>
                <button class="digit-button calculator-button">8</button>
                <button class="digit-button calculator-button">9</button>
                <button class="operator-button calculator-button">&divide;</button>
            </div>

            <div class="button-row row3">
                <button class="immediate-button calculator-button">&pi;</button>
                <button class="function-button calculator-button">cos</button>
                <button class="function-button calculator-button">log</button>
                <button class="digit-button calculator-button">4</button>
                <button class="digit-button calculator-button">5</button>
                <button class="digit-button calculator-button">6</button>
                <button class="operator-button calculator-button">&times;</button>
            </div>

            <div class="button-row row4">
                <button class="function-button calculator-button">e</button>
                <button class="function-button calculator-button">tan</button>
                <button class="function-button calculator-button">&Sqrt;</button>
                <button class="digit-button calculator-button">1</button>
                <button class="digit-button calculator-button">2</button>
                <button class="digit-button calculator-button">3</button>
                <button class="operator-button calculator-button">&minus;</button>
            </div>

            <div class="button-row row5">
                <button class="alt-function-button calculator-button">2nd</button>
                <button class="immediate-button calculator-button">&PlusMinus;</button>
                <button class="operator-button calculator-button">x<sup>y</sup></button>
                <button class="digit-button calculator-button">0</button>
                <button class="digit-button calculator-button">.</button>
                <button class="evaluate-button calculator-button">&equals;</button>
                <button class="operator-button calculator-button">&plus;</button>
            </div>

        </div>
    </div>

</body>

</html>
